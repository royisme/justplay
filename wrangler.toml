name = "just-play-game"
main = "./build/server/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_als"]
assets = { directory = "./build/client" }

[vars]
# OpenRouter configuration (supports multiple LLM providers)
# Model format: "provider/model-name" e.g., "openai/gpt-4o", "anthropic/claude-3.5-sonnet"
OPENROUTER_MODEL = "openai/gpt-4o"
NODE_NUM = "6"

# Better Auth configuration
# BETTER_AUTH_SECRET must be set in .dev.vars or Cloudflare secrets (min 32 chars)
# BETTER_AUTH_URL = "http://localhost:5173" (set in .dev.vars for local dev)
# ADMIN_EMAIL = "admin@example.com" (email that gets admin role on signup)

[[d1_databases]]
binding = "DB"
database_name = "just-play-db"
database_id = "5264151b-3b5b-4e47-b2d4-ab8c74d1e321"
[[kv_namespaces]]
binding = "GAME_STATE"
id = "0df818293a244408adb920e3bd704462"
